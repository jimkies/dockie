[package]
name = "dockie"
version = "0.1.0"
description = "Roblox multi-account launcher"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "dockie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.7", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
anyhow = "1.0.104"
base64 = "0.23.1"
url = "2.5.8"
tokio = { version = "1.54.1", features = ["sync", "time", "macros"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
windows = { version = "=0.62.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Environment", "Win32_System_Registry", "Win32_System_ProcessStatus", "Foundation", "Graphics_Capture", "Graphics_DirectX_Direct3D11", "Security_Authorization_AppCapabilityAccess", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Wdk_Foundation", "Wdk_System_SystemInformation"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
